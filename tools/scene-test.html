<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de prueba</title>
<link rel="stylesheet" href="/css/truco.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  #stage { position: fixed; inset: 0; }
  #ui { position: fixed; top: 6px; left: 6px; z-index: 5; display: flex; gap: 4px; flex-wrap: wrap; font: 13px system-ui; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <button id="cam">vista</button>
  <button id="throw">tira el 1</button>
  <button id="mythrow">tiro yo</button>
  <button id="sena">seña ciego (1)</button>
  <button id="look">1 me mira</button>
  <select id="amb"><option>bar</option><option>cafe</option><option>parrilla</option><option>parque</option><option>quincho</option><option>club</option><option>campo</option><option>chinatown</option></select>
  <select id="mode"><option>1v1</option><option selected>2v2</option><option>3v3</option></select>
  <select id="me"><option value="">yo: dibujado</option><option value="volcho" selected>yo: volcho</option><option value="olcho">yo: olcho</option><option value="gato-melon">yo: gato melón</option></select>
</div>
<script type="module">
import { TableScene } from '/js/scene.js';
import { lookFor } from '/js/characters.js';
const scene = new TableScene(document.getElementById('stage'));
window.scene = scene;
const $ = (id) => document.getElementById(id);
let n = 4;
let table = [];
function seats() {
  const mine = $('me').value;
  return Array.from({ length: n }, (_, i) => ({
    name: ['Theo', 'Volcho', 'Olcho', 'Tito', 'Coca', 'Beto'][i],
    cos: i === 0 ? (mine ? { personaje: mine } : {}) : i === 1 ? { personaje: 'volcho' } : i === 2 ? { personaje: 'olcho' } : i === 3 ? { personaje: 'gato-melon' } : {},
  }));
}
function setup() {
  n = { '1v1': 2, '2v2': 4, '3v3': 6 }[$('mode').value];
  scene.setLayout({ n, me: 0, spectator: false });
  table = Array.from({ length: n }, () => []);
  refresh();
  scene.setMyLook(lookFor('Theo', 0));
  scene.setMyCards(['1E', '7O', '3C'], null);
}
function refresh() {
  const s = seats();
  scene.setDecks(s);
  scene.setPlayers(s, s.map(() => 3));
  scene.syncTable(table, { animate: true });
}
$('mode').onchange = setup;
$('amb').onchange = () => scene.setAmbiente($('amb').value);
$('me').onchange = refresh;
$('cam').onclick = () => ($('cam').textContent = scene.cycleCamMode());
$('throw').onclick = () => {
  table[1].push({ c: ['4B', '5C', '12O'][table[1].length % 3], faceDown: false, round: table[1].length });
  scene.syncTable(table, { animate: true });
};
$('mythrow').onclick = () => {
  const c = ['1E', '7O', '3C'][table[0].length % 3];
  table[0].push({ c, faceDown: false, round: table[0].length });
  scene.setMyCards(['1E', '7O', '3C'].slice(table[0].length), null);
  scene.syncTable(table, { animate: true });
};
$('sena').onclick = () => scene.showSena(1, 'ciego', 3000);
$('look').onclick = () => scene.setGaze(1, 0);
setup();
// Captura para revisar sin mirar la pantalla (la guarda tools/serve.mjs en tools/shots/<nombre>.png).
window.shoot = async (name, { amb, mode = 'back', yaw = 0, pitch = -0.3 } = {}) => {
  if (amb) scene.setAmbiente(amb);
  scene.setCamMode(mode);
  scene.yaw = scene.tYaw = yaw;
  scene.pitch = scene.tPitch = pitch;
  scene.renderer.setPixelRatio(1);
  scene.renderer.setSize(960, 600, false);
  scene.camera.aspect = 960 / 600;
  scene.camera.updateProjectionMatrix();
  scene.applyCamera();
  for (let i = 0; i < 3; i++) scene.frame();
  scene.renderer.shadowMap.needsUpdate = true;
  scene.renderer.render(scene.scene, scene.camera);
  const blob = await new Promise((ok) => scene.renderer.domElement.toBlob(ok, 'image/png'));
  await fetch(`/tools/shots/${name}.png`, { method: 'PUT', body: blob });
  return name;
};
// La foto de cada mapa para la tienda (public/img/mapas/<ambiente>.webp): la mesa vacía, mirando al fondo del lugar.
window.mapShots = async (ids = [...$('amb').options].map((o) => o.value), { yaw = 0, pitch = 0.08 } = {}) => {
  // sin nadie sentado ni cartas: se ve el lugar
  scene.setPlayers(seats().map(() => null), null);
  scene.setMyCards([], null);
  scene.syncTable(seats().map(() => []), { animate: false });
  for (const id of ids) {
    scene.setAmbiente(id);
    scene.setCamMode('back');
    scene.yaw = scene.tYaw = yaw;
    scene.pitch = scene.tPitch = pitch;
    scene.renderer.setPixelRatio(1);
    scene.renderer.setSize(640, 400, false);
    scene.camera.aspect = 640 / 400;
    scene.camera.updateProjectionMatrix();
    scene.applyCamera();
    for (let i = 0; i < 3; i++) scene.frame();
    scene.renderer.shadowMap.needsUpdate = true;
    scene.renderer.render(scene.scene, scene.camera);
    const blob = await new Promise((ok) => scene.renderer.domElement.toBlob(ok, 'image/webp', 0.86));
    await fetch(`/img/mapas/${id}.webp`, { method: 'PUT', body: blob });
  }
  refresh();
  return ids;
};
</script>
</body>
</html>
