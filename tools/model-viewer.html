<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de personajes</title>
<style>
  body { margin: 0; background: #222; color: #eee; font: 14px system-ui, sans-serif; }
  #ui { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 95vw; }
  button, select { font: inherit; }
  canvas { display: block; margin-top: 40px; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="ui">
  <select id="model"><option>volcho</option><option>olcho</option></select>
  <select id="expr"><option>neutral</option><option>brows</option><option>wink</option><option>mouthRight</option><option>mouthLeft</option><option>bite</option><option>kiss</option><option>open</option><option>eyesClosed</option><option>puff</option><option>nose</option><option>frown</option><option>talk</option></select>
  <select id="view"><option value="front">frente</option><option value="side">costado</option><option value="face">cara</option><option value="back">atrás</option><option value="top">arriba</option></select>
  <label>cabeza <input id="yaw" type="range" min="-1" max="1" step="0.05" value="0"></label>
  <label>abajo <input id="down" type="range" min="0" max="1" step="0.05" value="0"></label>
  <button id="reach">tirar</button>
  <button id="shot">guardar foto para la tienda</button>
</div>
<script type="module">
import * as THREE from 'three';
import { loadModel, Rig } from '/js/models.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(760, 540);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#3a3330');
scene.add(new THREE.HemisphereLight('#fff', '#553', 1.6));
const sun = new THREE.DirectionalLight('#fff', 1.2);
sun.position.set(1, 3, 2);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, 760 / 540, 0.02, 40);
const table = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.04, 0.8), new THREE.MeshLambertMaterial({ color: '#2f6b3a' }));
table.position.set(0, 0.72, 0.75);
const chair = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.05, 0.44), new THREE.MeshLambertMaterial({ color: '#7a4a2a' }));
chair.position.set(0, 0.46, -0.05);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshLambertMaterial({ color: '#555' }));
floor.rotation.x = -Math.PI / 2;
scene.add(table, chair, floor);
let rig = null;
let reachUntil = 0;
async function load(id) {
  if (rig) scene.remove(rig.root);
  const tpl = await loadModel(`/models/${id}.glb`);
  rig = new Rig(tpl, { scale: 0.86 });
  scene.add(rig.root);
  window.rig = rig;
}
const $ = (id) => document.getElementById(id);
$('model').onchange = () => load($('model').value);
$('reach').onclick = () => (reachUntil = performance.now() + 700);
// foto de busto (sin mesa) para la tienda: public/models/<id>.webp
$('shot').onclick = async () => {
  const id = $('model').value;
  const r2 = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r2.setSize(256, 280);
  r2.outputColorSpace = THREE.SRGBColorSpace;
  const cam = new THREE.PerspectiveCamera(30, 256 / 280, 0.02, 20);
  const head = rig.at('Head');
  cam.position.set(head.x, head.y + 0.12, head.z + 1.35);
  cam.lookAt(head.x, head.y + 0.06, head.z);
  table.visible = chair.visible = floor.visible = false;
  const bg = scene.background;
  scene.background = null;
  rig.pose({ headYaw: 0, headDown: 0 });
  rig.face?.set('neutral');
  r2.render(scene, cam);
  scene.background = bg;
  table.visible = chair.visible = floor.visible = true;
  const blob = await new Promise((ok) => r2.domElement.toBlob(ok, 'image/webp', 0.9));
  await fetch(`/models/${id}.webp`, { method: 'PUT', body: blob });
  r2.dispose();
  document.title = 'foto guardada: ' + id;
};
function placeCam() {
  const v = $('view').value;
  const P = { front: [0, 1.3, 2.4, 0, 0.95, 0], side: [2.2, 1.2, 0.3, 0, 0.9, 0.2], face: [0, 1.25, 0.9, 0, 1.18, 0], back: [0, 1.6, -1.8, 0, 0.9, 0.5], top: [0.01, 3, 0.4, 0, 0.6, 0.4] }[v];
  camera.position.set(P[0], P[1], P[2]);
  camera.lookAt(P[3], P[4], P[5]);
}
renderer.setAnimationLoop((ms) => {
  placeCam();
  if (rig) {
    const t = Math.max(0, (reachUntil - ms) / 700);
    const k = Math.sin(t * Math.PI);
    const right = k > 0 ? rig.local(-0.1 * (1 - k), 0.76 + 0.05 * k, 0.4 + 0.3 * k) : null;
    rig.pose({ headYaw: Number($('yaw').value), headDown: Number($('down').value), right, breathe: Math.sin(ms / 900) });
    const e = $('expr').value;
    rig.face?.set(e === 'talk' ? 'neutral' : e, e === 'talk' && Math.floor(ms / 130) % 2 === 0, 0.5 + 0.5 * Math.sin(ms / 200));
  }
  renderer.render(scene, camera);
});
load('volcho');
</script>
</body>
</html>
