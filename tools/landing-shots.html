<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imágenes para la landing</title>
<!-- Personajes, paños y dorsos dibujados con el código del juego, para la vitrina de la landing (repo trukeados-landing).
     node tools/serve.mjs, abrir /tools/landing-shots.html y llamar a save(): quedan en tools/landing/ (no van al juego). -->
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
<style>body { background: #222; } canvas { width: 160px; margin: 4px; }</style>
</head>
<body>
<script type="module">
import { randomLook } from '/js/config.js';
import { COSMETIC_LOOK } from '/js/theme.js';
import { drawCharacter, lookFor, W, H } from '/js/characters.js';
import { drawPano, paintBox, paintBack } from '/js/panos.js';
import { seeded } from '/js/impasto.js';

const out = [];
const add = (name, c) => { document.body.append(c); out.push([name, c]); };
const canvas = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });

// personajes al azar (siempre los mismos: semilla fija)
const rng = seeded(1889);
for (let i = 0; i < 8; i++) {
  const c = canvas(W, H);
  drawCharacter(c.getContext('2d'), lookFor('Vitrina' + i, 0, randomLook(rng)), { expr: 'neutral', cards: 0 });
  add(`personaje-${i + 1}`, c);
}
// paños pintados: solo el dibujo, cuadrado, como se ve en la mesa
for (const id of Object.keys(COSMETIC_LOOK).filter((k) => COSMETIC_LOOK[k].draw)) {
  const big = canvas(1400, 1400);
  drawPano(big, COSMETIC_LOOK[id], 4);
  const box = paintBox(4);
  const s = 1400 * box.w * 0.985;
  const c = canvas(720, 720);
  c.getContext('2d').drawImage(big, (1400 - s) / 2, (1400 - s) / 2, s, s, 0, 0, 720, 720);
  add(id, c);
}
// dorso pintado
add('dorso-estrellada', paintBack('estrellada', 512, 788));

window.save = async () => {
  for (const [n, c] of out) {
    const b = await new Promise((ok) => c.toBlob(ok, 'image/webp', 0.86));
    await fetch(`/tools/landing/${n}.webp`, { method: 'PUT', body: b });
  }
  return out.map(([n]) => n);
};
</script>
</body>
</html>
