<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trukeados</title>
  <meta name="description" content="Trukeados: truco argentino online en 3D. 1 vs 1, 2 vs 2 y 3 vs 3, con señas, chat y salas privadas.">
  <meta name="theme-color" content="#121212">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="/css/truco.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
</head>
<body>
  <!-- ============ MENÚ ============ -->
  <section id="menu" class="screen">
    <div class="m-wrap">
      <header class="m-head">
        <h1>Truke<span>ados</span></h1>
        <p class="tag">Truco argentino en 3D, con señas de verdad.</p>
      </header>

      <div class="m-card">
        <label class="m-name">
          <span class="w-av" id="name-av">?</span>
          <input id="name" maxlength="20" placeholder="¿Cómo te llaman en la mesa?" autocomplete="nickname">
        </label>

        <div class="m-main">
          <button class="btn primary big m-create" id="create" type="button">Armar una mesa<small>Elegís las reglas adentro e invitás a quien quieras</small></button>
          <form id="join-form" class="m-join">
            <input id="join-code" maxlength="4" placeholder="····" inputmode="numeric" pattern="[0-9]*" autocomplete="off" spellcheck="false" aria-label="Código de la mesa">
            <button class="btn big">Entrar</button>
            <small>¿Te pasaron un código? Ponelo acá.</small>
          </form>
        </div>

        <div class="m-modes">
          <div class="m-mode" id="quick">
            <h3>Partida rápida <small>con gente</small></h3>
            <div class="m-pills">
              <button type="button" data-mode="1v1">1 vs 1</button>
              <button type="button" data-mode="2v2">2 vs 2</button>
              <button type="button" data-mode="3v3">3 vs 3</button>
            </div>
          </div>
          <div class="m-mode" id="practice">
            <h3>Practicar <small>contra bots</small></h3>
            <div class="m-pills">
              <button type="button" data-mode="1v1">1 vs 1</button>
              <button type="button" data-mode="2v2">2 vs 2</button>
              <button type="button" data-mode="3v3">3 vs 3</button>
            </div>
          </div>
        </div>

        <div class="m-public hidden" id="public-wrap">
          <h3>Mesas públicas <small id="public-count"></small></h3>
          <div id="public-list" class="m-tables"></div>
        </div>
      </div>

      <footer class="credits">
        Cartas: “Naipes Libres” de Basquetteur (Wikimedia Commons), <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>, vectorizadas por gjenkins20.
      </footer>
    </div>
  </section>

  <!-- ============ PARTIDA ============ -->
  <section id="game" class="screen hidden">
    <div id="stage"></div>
    <div id="labels"></div>

    <div id="topbar">
      <button class="btn small ghost" id="leave" title="Salir">✕</button>
      <button class="code-chip" id="code-chip" title="Copiar enlace"><span>Sala</span><b id="room-code">-----</b></button>
      <div class="spacer"></div>
      <span id="spect" class="muted"></span>
      <button class="btn small ghost" id="voice-toggle" title="Voz de los cantos">Voz: sí</button>
      <button class="btn small ghost" id="zoom-btn" title="Mantené apretada la tecla Z (o este botón) para hacer zoom">Zoom <kbd>Z</kbd></button>
      <button class="btn small ghost" id="help-btn" title="Ayuda">?</button>
      <button class="btn small ghost" id="chat-toggle" title="Chat">Chat<i id="chat-badge" class="badge hidden"></i></button>
    </div>

    <div id="anotador" title="Anotador"></div>
    <div id="look-bar"></div>

    <!-- abajo a la izquierda: señas y trampa -->
    <div id="tools">
      <div class="dropdown" id="senas-dd">
        <button class="btn" id="senas-btn">Señas</button>
        <div class="menu hidden" id="senas-menu"></div>
      </div>
      <div class="dropdown" id="trampa-dd">
        <button class="btn danger" id="trampa-btn">Mostrá las dos</button>
        <div class="menu hidden" id="trampa-menu"></div>
      </div>
    </div>

    <!-- abajo a la derecha: qué pasa y qué podés hacer. El centro queda libre para tu mano. -->
    <aside id="panel" class="hidden">
      <div id="status-line"></div>
      <div id="card-actions" class="hidden">
        <span class="lbl">Carta elegida</span>
        <div class="btns">
          <button class="btn primary" data-play="normal">Tirar</button>
          <button class="btn" data-play="double" title="Trampa: tapás tu carta con otra. La de abajo juega ahora; la de arriba es tu carta de la ronda siguiente, quemada (vale un 4). Al terminar la ronda se ve quemada y te pueden pedir que muestres las dos.">Dos encimadas</button>
          <button class="btn" data-play="down" title="Boca abajo: se quema y vale como un 4">Tapada</button>
          <button class="btn danger hidden" data-play="burn" title="No es tu turno: la carta se quema y vale como un 4 en esta ronda">Tirarla igual (se quema)</button>
        </div>
      </div>
      <div id="actions"></div>
    </aside>

    <canvas id="mirror" width="240" height="240" class="hidden" title="Así te ven"></canvas>

    <aside id="chat" class="hidden">
      <div class="chat-head"><b>Chat</b><button class="btn small ghost" id="chat-close">✕</button></div>
      <div id="chat-log"></div>
      <div id="quick-phrases"></div>
      <form id="chat-form"><input id="chat-input" maxlength="280" placeholder="Escribí algo…" autocomplete="off"><button class="btn primary small">Enviar</button></form>
    </aside>

    <div id="waiting" class="overlay hidden"></div>
    <div id="toast-area"></div>
    <div id="result" class="hidden"></div>
    <div id="help" class="overlay hidden"></div>
  </section>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
